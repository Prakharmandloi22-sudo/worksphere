name: WorkSphere CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 1. Core API (Node.js/Express) Tests
  test-core-api:
    name: Core API Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/core-api/package-lock.json

      - name: Install Dependencies
        working-directory: services/core-api
        run: npm ci

      - name: Run Core API Tests
        working-directory: services/core-api
        run: npm test

  # 2. Python Analytics Package & FastAPI Microservice Tests
  test-python-services:
    name: Python Analytics & FastAPI Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest httpx fastapi uvicorn

      - name: Test Python Analytics Package
        working-directory: packages/python-analytics
        run: python -m pytest

      - name: Run Analytics Micro-benchmark
        working-directory: packages/python-analytics
        run: python -m worksphere_analytics.benchmark

      - name: Test FastAPI Microservice
        working-directory: services/analytics-service
        run: python -m pytest

  # 3. Next.js Frontend Tests
  test-frontend:
    name: Frontend Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: services/frontend
        run: npm test

  # 4. Docker Build & Validate
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test-core-api, test-python-services, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core API Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/core-api
          file: ./services/core-api/Dockerfile
          push: false

      - name: Build Analytics Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics-service
          file: ./services/analytics-service/Dockerfile
          push: false
